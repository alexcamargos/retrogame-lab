[project]
name = "retrogame-lab"
version = "0.1.0"
description = "Pipeline portatil e agnostico de hardware para emulacao e retro-gaming"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "RetroGame Lab Authors" }
]
dependencies = [
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
retrogame = "retrogame_lab.cli:app"
retrogame-lab = "retrogame_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "B", "UP", "C4", "SIM"]
ignore = [
    "D100", # Missing docstring in public module (checked where appropriate)
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
