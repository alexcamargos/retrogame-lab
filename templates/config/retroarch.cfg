# RetroArch Portable Configuration for RetroGame Lab
# Caminhos relativos a bin/retroarch/

savefile_directory = "../../data/saves/snes"
savestate_directory = "../../data/states"
rgui_browser_directory = "../../data/roms/snes"
system_directory = "../../data/bios"
core_updater_buildbot_cores_url = "https://buildbot.libretro.com/nightly/windows/x86_64/latest/"

video_driver = "vulkan"
video_vsync = "true"
video_fullscreen = "true"
video_scale_integer = "false"
video_smooth = "false"

menu_driver = "ozone"
menu_show_advanced_settings = "true"
notification_show_refresh_rate = "false"

config_save_on_exit = "false"
content_show_favorites = "true"
content_show_history = "true"

input_autodetect_enable = "true"
input_joypad_driver = "xinput"
